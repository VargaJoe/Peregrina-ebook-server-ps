name: Build and push Docker image to dockerhub

on:
  push:
    branches: [ "main", "develop", "feature/*", "bugfix/*" ]  # Add other branches as needed
  pull_request:
    branches: [ "main", "develop", "feature/*", "bugfix/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Login to dockerhub
      uses: docker/login-action@v3
      with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set Docker image tag
      id: vars
      run: |
        if [[ $GITHUB_REF == refs/heads/main ]]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)
          DATE=$(date +%Y%m%d)
          echo "TAG=preview" >> $GITHUB_ENV
          echo "EXTRA_TAG=$BRANCH_NAME-$DATE" >> $GITHUB_ENV
        fi

    - name: Build and push to dockerhub
      uses: docker/build-push-action@v6
      with:
       context: ./src
       push: true
       tags: |
         vargajoe/peregrina-ebook-server:${{ env.TAG }}
    
    - name: Build and push extra tag to dockerhub
      if: github.ref != 'refs/heads/main'
      uses: docker/build-push-action@v6
      with:
       context: ./src
       push: true
       tags: vargajoe/peregrina-ebook-server:${{ env.EXTRA_TAG }}
